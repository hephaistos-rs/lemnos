# Identity servers for testing `lemnos-auth` during development.
#
#   docker compose -f compose.dev.yml up -d --wait
#   cargo test -p lemnos-auth --all-features -- --ignored
#   docker compose -f compose.dev.yml down
#
# Nothing is persisted: every `up` starts from the files under dev/.
# All passwords and secrets here are for local testing only.

name: lemnos-dev

services:
  # LDAP directory (lldap). Users come from dev/ldap/users/*.json.
  #   LDAP:   ldap://localhost:3890   base dc=lemnos,dc=test
  #   Web UI: http://localhost:17170  (admin / admin-password)
  ldap:
    image: lldap/lldap:stable
    environment:
      LLDAP_LDAP_BASE_DN: dc=lemnos,dc=test
      LLDAP_LDAP_USER_PASS: admin-password
      LLDAP_JWT_SECRET: dev-only-jwt-secret-not-for-production
      LLDAP_KEY_SEED: dev-only-key-seed-not-for-production
    ports:
      - "127.0.0.1:3890:3890"
      - "127.0.0.1:17170:17170"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "/app/lldap", "healthcheck", "--config-file", "/data/lldap_config.toml"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Runs once after `ldap` is up, creates the users and groups, then exits.
  ldap-seed:
    image: lldap/lldap:stable
    depends_on:
      ldap:
        condition: service_healthy
    entrypoint: /app/bootstrap.sh
    environment:
      LLDAP_URL: http://ldap:17170
      LLDAP_ADMIN_USERNAME: admin
      LLDAP_ADMIN_PASSWORD: admin-password
    volumes:
      - ./dev/ldap/users:/bootstrap/user-configs:ro
      - ./dev/ldap/groups:/bootstrap/group-configs:ro
    restart: "no"

  # OpenID Connect provider (Dex). Also used as a plain OAuth2 provider.
  #   Issuer: http://localhost:5556/dex
  #   Users:  alice@lemnos.test / bob@lemnos.test, password "password"
  dex:
    image: ghcr.io/dexidp/dex:v2.46.0
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dev/dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "127.0.0.1:5556:5556"

  # SAML 2.0 identity provider (SimpleSAMLphp). Config is in dev/saml/.
  #   Metadata: http://localhost:8088/simplesaml/saml2/idp/metadata.php
  #   Users:    alice / alice-password, bob / bob-password
  saml:
    image: kenchan0130/simplesamlphp:1.19.9
    environment:
      # Read by the image's stock config; the files below replace it.
      SIMPLESAMLPHP_SP_ENTITY_ID: http://localhost:3000/auth/sso/saml
      SIMPLESAMLPHP_SP_ASSERTION_CONSUMER_SERVICE: http://localhost:3000/auth/sso/saml/acs
    volumes:
      - ./dev/saml/authsources.php:/var/www/simplesamlphp/config/authsources.php:ro
      - ./dev/saml/saml20-idp-hosted.php:/var/www/simplesamlphp/metadata/saml20-idp-hosted.php:ro
      - ./dev/saml/saml20-sp-remote.php:/var/www/simplesamlphp/metadata/saml20-sp-remote.php:ro
    ports:
      - "127.0.0.1:8088:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/simplesaml/saml2/idp/metadata.php"]
      interval: 2s
      timeout: 5s
      retries: 30
