[package]
name = "lemnos-proxmox"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
lemnos-core.workspace = true
tokio = { workspace = true, features = ["sync", "macros", "rt", "time", "net"] }
proxmox-api = { version = "0.2.0", features = ["reqwest-client"] }
# Same 0.13 line as `proxmox-api`, which also picks the TLS backend. Needed to
# hand it an HTTP client that verifies certificates.
reqwest = { version = "0.13", default-features = false }
thiserror = "2"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-native-roots"] }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-platform-verifier = "0.7"

[dev-dependencies]
serde_json = "1"
